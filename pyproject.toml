[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getmeajob"
version = "0.2.5"
description = "A free, local-first job-search and application assistant for macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["fastapi==0.162.0", "uvicorn==0.54.0", "jinja2==3.1.6", "python-multipart==0.0.33", "pypdf==6.21.4", "python-docx==1.2.0", "reportlab==5.1.0"]
test = ["httpx==0.28.1"]

[tool.setuptools.package-data]
getmeajob = ["templates/*.html"]

[project.scripts]
getmeajob = "getmeajob.__main__:main"

[tool.setuptools.packages.find]
include = ["getmeajob*"]
