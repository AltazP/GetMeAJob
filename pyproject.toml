[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getmeajob"
version = "0.2.5"
description = "A free, local-first job-search and application assistant for macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
getmeajob = "getmeajob.__main__:main"

[tool.setuptools.packages.find]
include = ["getmeajob*"]
